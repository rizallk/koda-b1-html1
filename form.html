<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <form action="" method="post">
      <label for="name">Siapa nama anda?</label><br />
      <input type="text" id="name" name="name" />

      <br />

      <label for="name">Berapa umur anda?</label><br />
      <input type="text" id="name" name="name" />

      <br />

      <label>Apa jenis kelamin anda?</label><br />
      <input type="radio" id="laki-laki" name="jk" value="laki-laki" /><label
        for="laki-laki"
        >Laki-laki</label
      >
      <input type="radio" id="perempuan" name="jk" value="perempuan" /><label
        for="perempuan"
        >Perempuan</label
      >

      <br />

      <label>Apakah anda perokok?</label><br />
      <input type="radio" id="ya" name="perokok" value="ya" /><label for="ya"
        >Ya</label
      >
      <input type="radio" id="tidak" name="perokok" value="tidak" /><label
        for="tidak"
        >Tidak</label
      >

      <br />

      <label>Jika anda perokok, rokok apa yang anda pernah coba?</label><br />
      <input
        type="checkbox"
        id="gudang-garam-filter"
        name="gudang-garam-filter"
        value="Guang Garam Filter"
      /><label for="gudang-garam-filter">Guang Garam Filter</label><br />
      <input
        type="checkbox"
        id="lucky-strike"
        name="lucky-strike"
        value="Lucky Strike"
      /><label for="lucky-strike">Lucky Strike</label><br />
      <input
        type="checkbox"
        id="marlboro"
        name="marlboro"
        value="marlboro"
      /><label for="marlboro">Marlboro</label><br />
      <input type="checkbox" id="esse" name="esse" value="esse" /><label
        for="esse"
        >Esse</label
      >
    </form>
  </body>
</html>
